[package]
name = "rus_document_importer_gui"
version = "6.3.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Portable Windows CSV-template document importer and ZIP packager"
repository = "https://github.com/TeenKode/Pake"
readme = "README.md"
publish = false

[dependencies]
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow"] }
rfd = "0.15.4"
egui_extras = "=0.31.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3.1"
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
