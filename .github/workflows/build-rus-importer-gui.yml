name: Build Windows GUI RusDocumentImporter v3

on:
  push:
    branches:
      - build/rus-importer-gui-v3-20261027
      - build/rus-importer-gui-v5-compact-20261027
      - build/rus-importer-gui-v5-1-csv-compat-20261028
      - build/rus-importer-v5-2-required-fields-20261028
      - build/rus-importer-v5-3-no-brackets-20261028
      - build/rus-importer-v5-4-file-only-brackets-20261028
      - build/rus-importer-v6-dynamic-template-20261028
  workflow_dispatch:

jobs:
  gui-win64:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Get sources
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            rus-importer-gui
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rus-importer-gui
      - name: Run Rust tests
        working-directory: rus-importer-gui
        run: cargo test --release
      - name: Build portable Windows GUI EXE
        working-directory: rus-importer-gui
        run: cargo build --release
      - name: Windows end-to-end CSV and ZIP check
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = (Resolve-Path 'rus-importer-gui/target/release/rus_document_importer_gui.exe').Path
          $dir = Join-Path $env:RUNNER_TEMP 'rus-gui-smoke'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          [IO.File]::WriteAllText((Join-Path $dir 'Положение об аттестации.pdf'), 'sample')
          [IO.File]::WriteAllText((Join-Path $dir 'component_import.csv'), 'Category;File;Name;Extra;Regulatory' + "`r`n" + 'Локальные;sample.pdf;Тест;Школа;да')
          $run = Start-Process -FilePath $bin -ArgumentList @('--smoke-test-folder', ('"' + $dir + '"')) -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "Program exited with $($run.ExitCode)" }
          if (!(Test-Path (Join-Path $dir 'Готовые/Polozhenie-ob-attestatsii.pdf'))) { throw 'Missing transliterated PDF' }
          $csvPath = Join-Path $dir 'Готовые/component_import.csv'
          if (!(Test-Path $csvPath)) { throw 'Missing CSV' }
          $raw = [IO.File]::ReadAllBytes($csvPath)
          if ($raw.Length -ge 3 -and $raw[0] -eq 0xEF -and $raw[1] -eq 0xBB -and $raw[2] -eq 0xBF) { throw 'CSV has BOM' }
          $strict = [Text.UTF8Encoding]::new($false,$true)
          $csv = $strict.GetString($raw)
          if (!$csv.StartsWith('Category;File;Name;Extra;Regulatory')) { throw 'Dynamic template CSV header mismatch' }
          if (!$csv.Contains('Положение об аттестации')) { throw 'Russian Name missing' }
          if (!$csv.Contains('Локальные;Polozhenie-ob-attestatsii.pdf;Положение об аттестации;Школа;Да')) { throw 'Template defaults/column mapping failed' }
          if (!$csv.Contains('Polozhenie-ob-attestatsii.pdf')) { throw 'File transliteration missing' }
          $archive = Join-Path $dir 'Готовые.zip'
          if (!(Test-Path $archive)) { throw 'ZIP missing' }
          Add-Type -AssemblyName System.IO.Compression
          $zip = [IO.Compression.ZipFile]::OpenRead($archive)
          try {
            $names = @($zip.Entries | ForEach-Object { $_.FullName })
            if ('component_import.csv' -notin $names -or 'Polozhenie-ob-attestatsii.pdf' -notin $names) { throw 'ZIP entries invalid' }
          } finally { $zip.Dispose() }
      - name: Check EXE exists
        shell: pwsh
        run: |
          if (!(Test-Path 'rus-importer-gui/target/release/rus_document_importer_gui.exe')) { throw 'EXE missing' }
      - name: Upload GUI EXE
        uses: actions/upload-artifact@v4
        with:
          name: RusDocumentImporter_GUI_v6_DynamicTemplate_Windows_x64
          path: rus-importer-gui/target/release/rus_document_importer_gui.exe
          if-no-files-found: error
